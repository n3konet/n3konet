<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 168" width="800" height="168" role="img" aria-label="Hi, I&#39;m Nori">
  <defs>
    <style>
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .intro-t1 {
        opacity: 0;
        animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.05s forwards;
      }
      .intro-t2 {
        opacity: 0;
        animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.16s forwards;
      }
      .intro-s1 {
        transform-origin: 0 0;
        opacity: 0;
        animation: popIn 0.7s cubic-bezier(0.34, 1.45, 0.64, 1) 0.1s forwards;
      }
      .intro-s2 {
        transform-origin: 0 0;
        opacity: 0;
        animation: popIn 0.7s cubic-bezier(0.34, 1.45, 0.64, 1) 0.22s forwards;
      }
      .intro-s3 {
        transform-origin: 0 0;
        opacity: 0;
        animation: popIn 0.7s cubic-bezier(0.34, 1.45, 0.64, 1) 0.32s forwards;
      }
      .idle-spin {
        transform-origin: 0 0;
        animation: spin 36s linear infinite;
      }
      .idle-float {
        transform-origin: 0 0;
        animation: floatY 5.5s ease-in-out infinite;
      }
      .idle-pulse {
        transform-origin: 0 0;
        animation: breathe 4.8s ease-in-out infinite;
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0px); }
      }
      @keyframes popIn {
        from { opacity: 0; transform: scale(0.5); }
        to   { opacity: 1; transform: scale(1); }
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      @keyframes floatY {
        0%, 100% { transform: translateY(0px); }
        50%      { transform: translateY(-5px); }
      }
      @keyframes breathe {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.08); }
      }
    </style>
  </defs>

  <path d="M 0 28 A 28 28 0 0 1 28 0 H 772 A 28 28 0 0 1 800 28 V 168 H 0 Z" fill="#16151C" />

  <g transform="translate(48, 0)">
    <g class="intro-t1">
      <text x="0" y="76" class="sans" font-size="32" font-weight="600" fill="#F4F3F8" letter-spacing="-0.6">
        Hi, I’m <tspan fill="#BFA8FF">Nori</tspan>
      </text>
    </g>
    <g class="intro-t2">
      <text x="0" y="109" class="sans" font-size="16.5" font-weight="400" fill="#9E9AA8">
        I’m a developer who’s tried a little bit of everything.
      </text>
    </g>
  </g>

  <!-- Shape Cluster -->
  <g transform="translate(694, 84)">
    <g class="intro-s1">
      <g class="idle-spin">
        <path d="M 34.9 -14.5 Q 46 0 34.9 14.5 Q 32.5 32.5 14.5 34.9 Q 0 46 -14.5 34.9 Q -32.5 32.5 -34.9 14.5 Q -46 0 -34.9 -14.5 Q -32.5 -32.5 -14.5 -34.9 Q 0 -46 14.5 -34.9 Q 32.5 -32.5 34.9 -14.5 Z" fill="#2B2540" />
      </g>
    </g>
  </g>

  <g transform="translate(652, 110)">
    <g class="intro-s2">
      <g class="idle-float">
        <g transform="rotate(-14)">
          <rect x="-26" y="-11" width="52" height="22" rx="11" fill="#BFA8FF" />
        </g>
      </g>
    </g>
  </g>

  <g transform="translate(734, 48)">
    <g class="intro-s3">
      <g class="idle-pulse">
        <circle cx="0" cy="0" r="16" fill="#453966" />
      </g>
    </g>
  </g>
</svg>