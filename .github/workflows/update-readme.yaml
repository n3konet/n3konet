name: Update Profile Stats

on:
  schedule:
    - cron: "0 6 1,15 * *" # 1st & 15th of each month at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-stats
  cancel-in-progress: true

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Update SVGs and commit if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          BIRTHDAY: ${{ secrets.BIRTHDAY }}
        run: |
          python3 scripts/generate-stats.py

          if ! git diff --quiet assets/ README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/ README.md
            git commit -m "chore: update profile [skip ci]"
            git push
          fi